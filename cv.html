<!DOCTYPE HTML>
<html>
<head>
	<title>CV — Kade Smiley</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<!-- Same as index.html, except the fallback here defaults to dark
	     if the visitor has never toggled anything before. A saved
	     choice from localStorage still wins over this default. -->
	<script>
		(function () {
			var saved = localStorage.getItem("theme");
			document.documentElement.setAttribute("data-theme", saved || "dark");
		})();
	</script>
	<link rel="stylesheet" href="assets/css/site.css" />
</head>
<body>

	<nav class="site-nav">
		<a href="index.html" class="site-logo">TITLE</a>
		<ul>
			<li><a href="index.html">Home</a></li>
			<li><a href="research.html">Research</a></li>
			<li><a href="cv.html" class="active">CV</a></li>
			<li><a href="outreach.html">Outreach</a></li>
			<li><a href="contact.html">Contact</a></li>
			<li><a href="essays.html">Essays</a></li>
			<li><button class="theme-toggle" aria-label="Toggle dark mode"><svg viewBox="0 0 512 512" aria-hidden="true"><path d="M448 256c0-106-86-192-192-192V448c106 0 192-86 192-192zM0 256a256 256 0 1 1 512 0A256 256 0 1 1 0 256z"/></svg></button></li>
		</ul>
	</nav>

	<!-- ============ HERO ============ -->
	<header class="hero has-title">
		<div class="hero-bg hero-bg-cv"></div>
		<h1 class="hero-title">CV</h1>
	</header>

	<!-- ============ CV ============ -->
	<!-- The PDF is the one thing that gets updated here — everything
	     else on this page just points at it, so a new CV only ever
	     means replacing assets/pdf/Kade_Smiley_CV.pdf. -->
	<section class="card-section bg-white">
		<div class="cv-actions">
			<a class="btn" href="assets/pdf/Kade_Smiley_CV.pdf" download>Download PDF</a>
		</div>
		<iframe class="cv-embed" src="assets/pdf/Kade_Smiley_CV.pdf" title="Kade Smiley CV"></iframe>
	</section>

	<!-- ============ FOOTER ============ -->
	<footer class="site-footer">
		<div class="site-footer-inner">
			<p>&copy; Kade Smiley. All rights reserved.</p>
		</div>
	</footer>

	<script src="assets/js/theme.js"></script>
	<script src="assets/js/parallax.js"></script>
</body>
</html>
